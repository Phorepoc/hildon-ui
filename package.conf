# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml). ".hildon/..." resolves to $PHOREPOC_BUILD/hildon/
# (paths.resolve) and registry/ is merged into core's registry.
# recipes/prebuild.sh builds the archives under $PHOREPOC_BUILD/hildon/, the stack's lower layers first (glib-symbian's recipes/stack_env.sh).
NAME=hildon-ui
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web
REPOS_x32="cxxrt glib-symbian gtk-symbian dbus-symbian"
# the GLib, GTK and D-Bus DLLs first: the Hildon ones link them (their import libraries come from this build)
COMPONENTS_x32="pheglib phegobject phegmodule phegthread phegio phepixman phefreetype phehb phepng phefontconfig phecairo phepango phepixbuf pheatk phegdk phegtk pixmap phedbus phedbusglib phedbusd phehildon phehildondesktop phehome phehomeexample sapwood phehildonwin phehcp phehcpdatetime phehcpregion phehcpdisplay phehcpabout phehcpprofiles phehomeclock phehomedate phehomestatus"
ADDON=0   # (an add-on archive would carry the GLib, GTK and D-Bus DLLs too: the package installs on top of their packages)
