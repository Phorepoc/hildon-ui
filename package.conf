# package.conf -- how the pdk's package.yml would build this repository's SIS files (release.yml). NOT WIRED YET: needs
# (1) recipes/build.sh + sis.sh (the recipes today are the manual steps in README.md), (2) a pdk change so that ".hildon/..."
# resolves to $PHOREPOC_BUILD/hildon/ and the layer's registry file is merged (see codecpack for the mechanism).
NAME=hildon-ui
ARCHES="x32"
IMAGE=ghcr.io/phorepoc/web
REPOS_x32="cxxrt glib-symbian gtk-symbian dbus-symbian"
COMPONENTS_x32="phehildon phehildondesktop"
