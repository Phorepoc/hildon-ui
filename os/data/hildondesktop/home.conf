# home.conf -- the plug-in configuration of the Home process (phehome): where the home applets' entries are, and that new ones found there are installed.
[X-PluginManager]
X-Plugin-Dir=z:/resource/hildondesktop/entries/home
X-Load-New-Plugins=true
X-Load-All-Plugins=false
X-Plugin-Configuration=home.plugins
X-Safe-Set=home.safe-set
